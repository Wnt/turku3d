# Voice presets for game/src/gameplay/content/dialogue.json. Any change here regenerates exactly the
# lines it affects (content-addressed cache; see README.md). Voice names are Kokoro-82M voice packs:
# a* = American, b* = British English G2P; f/m = female/male. "x,y" blends packs (mean style vector).

[engine]
name = "kokoro"
model = "hexgrad/Kokoro-82M"
revision = "f3ff3571791e39611d31c381e3a41a3af07b4987"
weights = "kokoro-v1_0.pth"
seed = 2027
threads = 4

[output]
lufs = -18.0
peak_dbfs = -1.0
bitrate_kbps = 32

# Calm, mid-40s, documentary tone.
[speakers.narrator]
voice = "bf_emma"
speed = 0.95

# Warm, impatient, older man.
[speakers.pizzeria]
voice = "bm_george"
speed = 1.05

# Fast-talking young salesman.
[speakers.dealer]
voice = "am_puck"
speed = 1.15

# Quiet, cautious, speaks low.
[speakers.market]
voice = "af_nicole"
speed = 0.9

# Neutral customer.
[speakers.customer]
voice = "af_heart"
speed = 1.0

# Finnish names spoken with Finnish phonemes (first-syllable stress, pure vowels, tapped r)
# instead of the English G2P guess. misaki writes the tap ɾ as its flap token.
[lexicon]
"Turku" = "tˈuɾku"
"Linnankatu" = "lˈinːɑŋkˌɑtu"
"Aurakatu" = "ˈɑuɾɑkˌɑtu"
"Läntinen Rantakatu" = "lˈæntinen ɾˈɑntɑkˌɑtu"
"Kristiinankatu" = "kɾˈistiːnɑŋkˌɑtu"
"Kaskenkatu" = "kˈɑskeŋkˌɑtu"
"Auransilta" = "ˈɑuɾɑnsˌiltɑ"
