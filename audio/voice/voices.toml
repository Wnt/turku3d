# Voice presets for game/src/gameplay/content/dialogue.json. Any change here regenerates exactly the
# lines it affects (content-addressed cache; see README.md). Voice names are Kokoro-82M voice packs:
# a* = American, b* = British English G2P; f/m = female/male. "x,y" blends packs (mean style vector).

[engine]
name = "kokoro"
model = "hexgrad/Kokoro-82M"
revision = "f3ff3571791e39611d31c381e3a41a3af07b4987"
weights = "kokoro-v1_0.pth"
seed = 2027
threads = 4
device = "mps"

[output]
lufs = -18.0
peak_dbfs = -1.0
bitrate_kbps = 32

# Calm, mid-40s, documentary tone.
[speakers.narrator]
voice = "bf_emma"
speed = 0.95

# Warm, impatient, older man.
[speakers.pizzeria]
voice = "bm_george"
speed = 1.05

# Fast-talking young salesman.
[speakers.dealer]
voice = "am_puck,am_fenrir"
speed = 1.15

# Quiet, cautious, speaks low (af_nicole's whisper scored UTMOS 3.3; af_sarah 4.5).
[speakers.market]
voice = "af_sarah"
speed = 0.88

# Neutral customer.
[speakers.customer]
voice = "af_heart"
speed = 1.0

# Finnish names the English G2P gets wrong, as phonemes. The benchmark
# (docs/reports/audio-voice-tts.md) found Turku, Linnankatu, Läntinen Rantakatu
# and Kaskenkatu sound right without an entry. Use English ɹ, not the Finnish tap
# ɾ: misaki turns ɾ into an American flap that is heard as "d".
[lexicon]
"Kristiinankatu" = "kɹˈistiːnɑŋkˌɑtu"
"Aurakatu" = "ˈɑuɹɑkˌɑtuː"
"Mustainveljestenkuja" = "mˈustɑinveljestenkˌujɑ"

# Dry, measured police officer; distinct from the narrator and shop voices.
[speakers.officer]
voice = "bm_fable"
speed = 0.96
