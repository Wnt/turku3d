<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turku Music Lab</title><style>
:root{font-family:system-ui,sans-serif;color:#e9f4f0;background:#111a22}body{max-width:1080px;margin:2rem auto;padding:0 1rem}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0}p{color:#9fb4be}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}.panel{background:#1b2932;border:1px solid #344751;border-radius:14px;padding:1.2rem}button,select,input{font:inherit}button,select{background:#2b424b;color:#fff;border:1px solid #5d8185;border-radius:8px;padding:.6rem .9rem;cursor:pointer}button.active{background:#ca694d;color:#111}label{display:grid;grid-template-columns:1fr 5rem;gap:.4rem;margin:.8rem 0}label input{grid-column:1/3;width:100%;accent-color:#e29a6b}output{justify-self:end}#meter{height:18px;background:#132028;border-radius:12px;overflow:hidden}#meter span{display:block;height:100%;width:0;background:#ec9b5f}small{color:#a7b8bd}pre{white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div><h1>Turku Music Lab</h1><p>Five procedural soundtracks · explore the deadline curve</p></div><button id="start">Start audio</button></header><main class="grid"><section class="panel"><h2>Playback</h2><select id="track" aria-label="Track"></select><p id="track-info"></p><div><button data-state="explore" class="active">Explore</button> <button data-state="mission">Mission</button> <button data-state="menu">Menu</button></div><label>Deadline <output id="deadline-value">0%</output><input id="deadline" type="range" min="0" max="100" value="0"></label><label>Simulate duration (seconds) <output id="duration-value">30</output><input id="duration" type="range" min="5" max="120" value="30"></label><button id="simulate">Simulate delivery</button> <button id="deliver">Deliver</button><p><button id="car" aria-pressed="false">Car</button> <button id="shop" aria-pressed="false">Shop</button></p><p id="status">Bar 1 · Beat 1 · 108 BPM</p><p id="layers">Layers: none</p><div id="meter"><span></span></div><small>Output level</small><p id="metrics">Level 0 · centroid 0 Hz</p></section><section class="panel"><h2>Tuning</h2><div id="sliders"></div><button id="copy">Copy as JSON</button><pre id="copied"></pre></section></main><script type="module" src="/src.ts"></script></body></html>
