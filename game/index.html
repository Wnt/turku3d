<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10252d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Turku3D</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; touch-action: none; }
      #hud { position: fixed; left: 8px; top: 8px; color: #e8e8e8; font: 12px/1.45 ui-monospace, Menlo, monospace; background: #000a; padding: 6px 10px; white-space: pre; pointer-events: none; border-radius: 4px; }
      #help { position: fixed; right: 8px; bottom: 8px; color: #ddd; font: 11px/1.4 ui-monospace, Menlo, monospace; background: #0008; padding: 4px 8px; white-space: pre; pointer-events: none; border-radius: 4px; }
      #start-screen { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #06151cc9; color: #edf4f3; font: 15px/1.5 system-ui, sans-serif; overflow: auto; }
      .start-card { width: min(560px, calc(100vw - 64px)); padding: 28px; background: #10252dee; border: 1px solid #47636c; border-radius: 12px; }
      .start-card h1 { margin: 8px 0; font-size: 30px; }
      .eyebrow { letter-spacing: .2em; color: #9de3cc; font-size: 12px; }
      #gamepad-status { color: #9de3cc; }
      #start-bindings { display: grid; grid-template-columns: 40px 1fr 40px 1fr; gap: 8px; }
      #start-bindings dt { font-weight: bold; color: #9de3cc; }
      #start-bindings dd { margin: 0; }
      .start-card button { padding: 12px 22px; border: 0; border-radius: 6px; background: #a1ebd3; color: #10252d; font: bold 16px system-ui; cursor: pointer; }
      .start-card button:disabled { opacity: .5; }
      .start-hint { font-size: 12px; }
      .start-credits { font-size: 11px; color: #9fb3b0; margin-bottom: 0; }
      .start-intro { font-size: 14px; color: #cfe0dd; border-left: 3px solid #a1ebd3; padding-left: 12px; }
      body.qa #hud, body.qa #help { display: none; }
      #minimap { position: fixed; left: 16px; bottom: 16px; z-index: 5; display: flex; flex-direction: column; gap: 6px; pointer-events: none; color: #f1f4f5; font: 600 14px/1.3 system-ui, sans-serif; text-shadow: 0 1px 2px #000c; }
      #minimap canvas { display: block; filter: drop-shadow(0 2px 6px #0008); }
      #minimap.expanded { left: 50%; bottom: auto; top: 50%; transform: translate(-50%, -50%); }
      .minimap-status { display: flex; flex-direction: column; gap: 2px; max-width: 240px; }
      .minimap-message { background: #0009; padding: 4px 8px; border-radius: 4px; }
      .minimap-row { display: flex; gap: 12px; align-items: baseline; }
      .minimap-timer { font-size: 18px; font-variant-numeric: tabular-nums; }
      .minimap-timer.urgent { color: #ff6b6b; }
      .minimap-money { color: #8fe3a0; font-size: 18px; font-variant-numeric: tabular-nums; }
      #zone-labels { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
      .zone-label { position: absolute; left: 0; top: 0; padding: 3px 10px; border-radius: 999px; background: #0b1020c4; color: #f4f1ea; border: 2px solid var(--zone-colour); font: 600 14px/1.3 system-ui, sans-serif; white-space: nowrap; text-shadow: 0 1px 2px #000; box-shadow: 0 0 12px var(--zone-colour); }
      #shop-menu { position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; color: #efe6d8; font: 15px/1.35 system-ui, sans-serif;
        background: linear-gradient(90deg, #0b1020f2 0%, #0b1020d9 38%, #0b102033 70%, #0b102000 100%), var(--shop-art) center / cover no-repeat, #141a2e; }
      #shop-menu[hidden] { display: none; }
      .shop-panel { width: min(540px, calc(100vw - 48px)); max-height: 100vh; overflow: auto; box-sizing: border-box; padding: 16px 0; margin-left: max(24px, 5vw); }
      .shop-panel h2 { margin: 0; font-size: clamp(22px, 4.4vh, 34px); letter-spacing: .02em; }
      .shop-status { margin: 2px 0 10px; color: #3fa7a0; font-weight: 600; font-variant-numeric: tabular-nums; }
      .shop-speaker { margin: 0; color: #f2a541; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
      .shop-line { margin: 2px 0 12px; font-size: clamp(15px, 2.6vh, 19px); font-style: italic; min-height: 2.7em; }
      .shop-options { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      .shop-option { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 5px 14px 5px 5px; border-radius: 10px; background: #1b2133e6; border: 2px solid #2c3550; cursor: pointer; }
      .shop-option.selected { border-color: #f2a541; background: #2c3550f0; box-shadow: 0 0 0 3px #f2a54133; }
      .shop-option.disabled { opacity: .55; }
      .shop-option.disabled .shop-icon { filter: grayscale(1); }
      .shop-icon { width: 48px; height: 48px; border-radius: 8px; background: #1b2133 center / cover no-repeat; }
      .shop-icon.empty { background: none; }
      .shop-text { display: flex; flex-direction: column; }
      .shop-label { font-weight: 600; font-size: 16px; }
      .shop-detail { color: #c9c2b4; }
      .shop-reason { color: #ff8a73; }
      .shop-price { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; color: #f2a541; }
      .shop-price.income { color: #8fe3a0; }
      .shop-hints { margin: 12px 0 0; color: #c9c2b4; font-size: 13px; }
      .start-touch, .start-fullscreen { color: #9de3cc; }
      .start-touch[hidden], .start-fullscreen[hidden] { display: none; }
      /* Touch play (input/touch.ts): thumb buttons over the scene; the canvas is the stick and look area. */
      #touch-controls { position: fixed; inset: 0; z-index: 9; pointer-events: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #touch-controls[hidden], #touch-controls [hidden] { display: none; }
      .touch-stick { position: absolute; left: 0; top: 0; width: 128px; height: 128px; margin: -64px 0 0 -64px; border-radius: 50%; background: #ffffff1f; border: 2px solid #ffffff55; box-sizing: border-box; }
      .touch-knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: #ffffff66; }
      .touch-buttons { position: absolute; right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(2, 64px); gap: 10px; direction: rtl; }
      .touch-corner { position: absolute; right: calc(12px + env(safe-area-inset-right)); top: calc(12px + env(safe-area-inset-top)); display: flex; flex-direction: row-reverse; gap: 10px; }
      .touch-button { pointer-events: auto; touch-action: none; width: 64px; height: 64px; padding: 0; border-radius: 50%; border: 2px solid #ffffff80; background: #0b102080; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 600 20px/1 system-ui, sans-serif; text-shadow: 0 1px 2px #000; direction: ltr; }
      .touch-button small { font-size: 9px; font-weight: 600; margin-top: 3px; letter-spacing: .02em; }
      .touch-corner .touch-button { width: 56px; height: 56px; font-size: 13px; }
      .touch-button:active { background: #f2a541a0; }
      body:has(#touch-controls:not([hidden])) :is(#help, #audio-panel, #time-control) { display: none; }
      #fullscreen-overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #06151ce6; }
      #fullscreen-overlay[hidden] { display: none; }
      #fullscreen-overlay button { padding: 18px 28px; border: 0; border-radius: 10px; background: #a1ebd3; color: #10252d; font: bold 18px system-ui, sans-serif; }
      .shop-option { touch-action: manipulation; }
    </style>
  </head>
  <body>
    <div id="hud">loading…</div>
    <div id="help">Connect a controller and press a button, or click for keyboard/mouse controls.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
