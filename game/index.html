<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Turku3D</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }
      #hud { position: fixed; left: 8px; top: 8px; color: #e8e8e8; font: 12px/1.45 ui-monospace, Menlo, monospace; background: #000a; padding: 6px 10px; white-space: pre; pointer-events: none; border-radius: 4px; }
      #help { position: fixed; right: 8px; bottom: 8px; color: #ddd; font: 11px/1.4 ui-monospace, Menlo, monospace; background: #0008; padding: 4px 8px; white-space: pre; pointer-events: none; border-radius: 4px; }
      #start-screen { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #06151cc9; color: #edf4f3; font: 15px/1.5 system-ui, sans-serif; overflow: auto; }
      .start-card { width: min(560px, calc(100vw - 64px)); padding: 28px; background: #10252dee; border: 1px solid #47636c; border-radius: 12px; }
      .start-card h1 { margin: 8px 0; font-size: 30px; }
      .eyebrow { letter-spacing: .2em; color: #9de3cc; font-size: 12px; }
      #gamepad-status { color: #9de3cc; }
      #start-bindings { display: grid; grid-template-columns: 40px 1fr 40px 1fr; gap: 8px; }
      #start-bindings dt { font-weight: bold; color: #9de3cc; }
      #start-bindings dd { margin: 0; }
      .start-card button { padding: 12px 22px; border: 0; border-radius: 6px; background: #a1ebd3; color: #10252d; font: bold 16px system-ui; cursor: pointer; }
      .start-card button:disabled { opacity: .5; }
      .start-hint { font-size: 12px; }
      .start-intro { font-size: 14px; color: #cfe0dd; border-left: 3px solid #a1ebd3; padding-left: 12px; }
      body.qa #hud, body.qa #help { display: none; }
    </style>
  </head>
  <body>
    <div id="hud">loading…</div>
    <div id="help">Connect a controller and press a button, or click for keyboard/mouse controls.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
