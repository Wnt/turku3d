<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10252d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Turku3D</title>
    <link rel="icon" href="data:," />
    <style>
      #loading-screen { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: radial-gradient(ellipse at 70% 25%, #234e56, #08191f 75%); color: #edf4f3; font: 14px/1.5 system-ui, sans-serif; pointer-events: none; }
      .loading-panel { width: min(720px, calc(100vw - 64px)); }
      .loading-panel h1 { font-size: clamp(26px, 4vw, 42px); margin: 10px 0 24px; }
      .loading-active { color: #a1ebd3; overflow-wrap: anywhere; max-height: 5em; overflow: hidden; }
      .loading-panel progress { width: 100%; height: 6px; accent-color: #a1ebd3; }
      .loading-count { color: #a6bdbb; font-size: 12px; }
      .loading-log { color: #9eb5b7; font: 12px/1.8 ui-monospace, Menlo, monospace; height: 17em; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; border-top: 1px solid #47636c; padding-top: 16px; }
      #loading-screen.menu-ready { inset: auto 12px 12px auto; display: block; width: min(300px, calc(100vw - 24px)); box-sizing: border-box; padding: 12px; border: 1px solid #47636c; border-radius: 8px; background: #08191fe8; }
      .menu-ready .loading-panel { width: 100%; }
      .menu-ready h1, .menu-ready .eyebrow, .menu-ready .loading-log { display: none; }
      .menu-ready p { margin: 4px 0; }
      #loading-screen[hidden] { display: none; }
      @media (max-width: 1100px) { #loading-screen.menu-ready { visibility: hidden; } }
      .pole-notice { position: fixed; z-index: 90; top: 20px; right: 20px; display: flex; align-items: center; gap: 12px; width: min(370px, calc(100vw - 40px)); padding: 10px; border: 2px solid #d2b979; border-radius: 12px; background: #213d50ed; color: #fff4da; font: 600 15px/1.35 system-ui, sans-serif; box-shadow: 0 8px 30px #0008; pointer-events: none; transform: translateX(calc(100% + 30px)); opacity: 0; transition: transform .3s ease, opacity .3s ease; }
      .pole-notice.visible { transform: translateX(0); opacity: 1; }
      .pole-notice-portrait { position: relative; flex: 0 0 70px; width: 70px; height: 70px; overflow: hidden; border-radius: 8px; }
      .pole-notice-portrait img { position: absolute; inset: 0; width: 100%; height: 100%; }
      .pole-notice-portrait img + img { opacity: 0; }
      .pole-notice.talking .pole-notice-portrait img + img { animation: officer-talk .167s steps(1) infinite; }
      @keyframes officer-talk { 50% { opacity: 1; } }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; touch-action: none; }
      #hud { position: fixed; left: 8px; top: 8px; color: #e8e8e8; font: 12px/1.45 ui-monospace, Menlo, monospace; background: #000a; padding: 6px 10px; white-space: pre; pointer-events: none; border-radius: 4px; }
      #hud.player-name { font: 600 16px/1.3 system-ui, sans-serif; padding: 8px 12px; text-shadow: 0 1px 2px #000c; }
      body:not(.debug-hud) .draft-tile-badge { display: none !important; }
      #mp-scoreboard { position: fixed; right: 10px; top: 10px; z-index: 4; max-width: min(340px, 48vw); padding: 8px 10px; color: #fff; background: #10252de8; border: 1px solid #47636c; border-radius: 8px; font: 12px/1.4 system-ui, sans-serif; pointer-events: none; }
      #mp-scoreboard[hidden], #mp-scoreboard div[hidden] { display: none; }
      #mp-scoreboard table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; white-space: nowrap; }
      #mp-scoreboard th, #mp-scoreboard td { padding: 2px 5px; text-align: right; }
      #mp-scoreboard th { color: #bbced4; font-size: 10px; font-weight: 500; }
      #mp-scoreboard th:nth-child(2), #mp-scoreboard td:nth-child(2) { text-align: left; }
      #mp-scoreboard .mp-self { background: #31594f; color: #fff3ac; font-weight: 700; }
      #mp-scoreboard .mp-offline { opacity: .5; }
      #mp-scoreboard .mp-separated td { border-top: 1px solid #789199; }
      #mp-scoreboard caption { caption-side: bottom; color: #bbced4; font-size: 10px; padding-top: 3px; }
      #mp-scoreboard .mp-countdown { color: #ffdb6d; font-weight: 700; }
      #mp-crash-flash { position: fixed; inset: 0; z-index: 3; background: #d12b20; opacity: 0; pointer-events: none; }
      #city-clock { position: fixed; left: 8px; top: 54px; padding: 4px 8px; background: #0008; border-radius: 4px; color: #e8eee9; font: 600 13px/1.4 system-ui, sans-serif; text-shadow: 0 1px 3px #000; pointer-events: none; }
      body.debug-hud #city-clock { top: 180px; }
      #help[hidden] { display: none; }
      #help { position: fixed; right: 8px; bottom: 8px; color: #ddd; font: 11px/1.4 ui-monospace, Menlo, monospace; background: #0008; padding: 4px 8px; white-space: pre; pointer-events: none; border-radius: 4px; }
      #start-screen { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #06151cc9; color: #edf4f3; font: 15px/1.5 system-ui, sans-serif; overflow: auto; }
      .start-card { width: min(560px, calc(100vw - 64px)); padding: 28px; background: #10252dee; border: 1px solid #47636c; border-radius: 12px; }
      .start-card h1 { margin: 8px 0; font-size: 30px; }
      .eyebrow { letter-spacing: .2em; color: #9de3cc; font-size: 12px; }
      #gamepad-status { color: #9de3cc; }
      #start-bindings { display: grid; grid-template-columns: 40px 1fr 40px 1fr; gap: 8px; }
      #start-bindings dt { font-weight: bold; color: #9de3cc; }
      #start-bindings dd { margin: 0; }
      .start-hint { font-size: 12px; }
      .start-credits { font-size: 11px; color: #9fb3b0; margin-bottom: 0; }
      body.qa #hud, body.qa #help { display: none; }
      #minimap { position: fixed; left: 16px; bottom: 16px; z-index: 5; display: flex; flex-direction: column; gap: 6px; pointer-events: none; color: #f1f4f5; font: 600 14px/1.3 system-ui, sans-serif; text-shadow: 0 1px 2px #000c; }
      #minimap canvas { display: block; filter: drop-shadow(0 2px 6px #0008); }
      #minimap.expanded { left: 50%; bottom: auto; top: 50%; transform: translate(-50%, -50%); }
      .minimap-status { display: flex; flex-direction: column; gap: 2px; max-width: 240px; }
      .minimap-message { background: #0009; padding: 4px 8px; border-radius: 4px; }
      .minimap-row { display: flex; gap: 12px; align-items: baseline; }
      .minimap-timer { font-size: 18px; font-variant-numeric: tabular-nums; }
      .minimap-timer.urgent { color: #ff6b6b; }
      .minimap-money { color: #8fe3a0; font-size: 18px; font-variant-numeric: tabular-nums; }
      #recovery { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; color: #f4f1ea; font: 600 17px/1.35 system-ui, sans-serif; text-shadow: 0 1px 2px #000; text-align: center; max-width: min(640px, calc(100vw - 32px)); }
      .recovery-line { background: #0b1020d9; border: 2px solid #f4c430; padding: 8px 16px; border-radius: 6px; }
      .recovery-line.fading { opacity: 0; transition: opacity 3s ease-in; }
      .recovery-edge { background: #0b1020b8; border: 2px solid #ff6b6b; padding: 4px 12px; border-radius: 999px; font-size: 14px; }
      #recovery [hidden] { display: none; }
      #zone-labels { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
      .zone-label { position: absolute; left: 0; top: 0; padding: 3px 10px; border-radius: 999px; background: #0b1020c4; color: #f4f1ea; border: 2px solid var(--zone-colour); font: 600 14px/1.3 system-ui, sans-serif; white-space: nowrap; text-shadow: 0 1px 2px #000; box-shadow: 0 0 12px var(--zone-colour); }
      #shop-menu { position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; color: #efe6d8; font: 15px/1.35 system-ui, sans-serif;
        background: linear-gradient(90deg, #0b1020f2 0%, #0b1020d9 38%, #0b102033 70%, #0b102000 100%), var(--shop-art) center / cover no-repeat, #141a2e; }
      #shop-menu[hidden] { display: none; }
      #intro-dialog { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; color: #efe6d8; font: 16px/1.5 system-ui, sans-serif;
        background: linear-gradient(90deg, #0b1020f5 0%, #0b1020db 36%, #0b102044 68%, #0b102000 100%), var(--intro-art) center / cover no-repeat, #141a2e; }
      #intro-dialog[hidden] { display: none; }
      .intro-panel { width: min(560px, calc(100vw - 48px)); margin-left: max(24px, 5vw); }
      .intro-panel h2 { margin: 4px 0 18px; font-size: clamp(28px, 5vh, 42px); }
      .intro-line { min-height: 7em; font-size: clamp(18px, 3vh, 24px); }
      .intro-count { color: #f2a541; font-weight: 700; }
      .intro-panel button { margin: 4px 10px 4px 0; padding: 10px 18px; color: #efe6d8; background: #1b2133e6; border: 2px solid #f2a541; border-radius: 8px; font: inherit; cursor: pointer; }
      .intro-panel button:focus-visible { outline: 3px solid #fff; }
      .shop-panel { width: min(540px, calc(100vw - 48px)); max-height: 100vh; overflow: auto; box-sizing: border-box; padding: 16px 0; margin-left: max(24px, 5vw); }
      .shop-panel h2 { margin: 0; font-size: clamp(22px, 4.4vh, 34px); letter-spacing: .02em; }
      .shop-status { margin: 2px 0 10px; color: #3fa7a0; font-weight: 600; font-variant-numeric: tabular-nums; }
      .shop-speaker { margin: 0; color: #f2a541; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
      .shop-line { margin: 2px 0 12px; font-size: clamp(15px, 2.6vh, 19px); font-style: italic; min-height: 2.7em; }
      .shop-options { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      .shop-option { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 5px 14px 5px 5px; border-radius: 10px; background: #1b2133e6; border: 2px solid #2c3550; cursor: pointer; }
      .shop-option.selected { border-color: #f2a541; background: #2c3550f0; box-shadow: 0 0 0 3px #f2a54133; }
      .shop-option.disabled { opacity: .55; }
      .shop-option.disabled .shop-icon { filter: grayscale(1); }
      .shop-icon { width: 48px; height: 48px; border-radius: 8px; background: #1b2133 center / cover no-repeat; }
      .shop-icon.empty { background: none; }
      .shop-text { display: flex; flex-direction: column; }
      .shop-label { font-weight: 600; font-size: 16px; }
      .shop-detail { color: #c9c2b4; }
      .shop-reason { color: #ff8a73; }
      .shop-price { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; color: #f2a541; }
      .shop-price.income { color: #8fe3a0; }
      .shop-hints { margin: 12px 0 0; color: #c9c2b4; font-size: 13px; }
      /* Start screen and pause menu pages (ui/menu.ts MenuPanel). */
      #pause-menu { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: #06151cb3; color: #edf4f3; font: 15px/1.4 system-ui, sans-serif; overflow: auto; }
      #pause-menu[hidden] { display: none; }
      #pause-menu .menu-panel { width: min(480px, calc(100vw - 32px)); box-sizing: border-box; padding: 22px; background: #10252dee; border: 1px solid #47636c; border-radius: 12px; }
      .menu-title { margin: 0 0 6px; font-size: 22px; }
      #start-screen .menu-title { display: none; }
      .menu-text { margin: 0 0 10px; color: #9de3cc; }
      .menu-text[hidden] { display: none; }
      .menu-options { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      .menu-option { display: flex; flex-direction: column; padding: 9px 14px; border-radius: 8px; background: #17343ee6; border: 2px solid #2c5560; cursor: pointer; touch-action: manipulation; }
      .menu-option.selected { border-color: #a1ebd3; background: #21474fe6; box-shadow: 0 0 0 3px #a1ebd333; }
      .menu-option.disabled { opacity: .5; cursor: default; }
      .menu-label { font-weight: 600; font-size: 16px; }
      .menu-detail { color: #b9cdc9; font-size: 13px; }
      .menu-hints { margin: 10px 0 0; color: #b9cdc9; font-size: 12px; }
      .start-touch, .start-fullscreen { color: #9de3cc; }
      .start-touch[hidden], .start-fullscreen[hidden] { display: none; }
      /* Touch play (input/touch.ts): thumb buttons over the scene; the canvas is the stick and look area. */
      #touch-controls { position: fixed; inset: 0; z-index: 9; pointer-events: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #touch-controls[hidden], #touch-controls [hidden] { display: none; }
      .touch-stick { position: absolute; left: 0; top: 0; width: 128px; height: 128px; margin: -64px 0 0 -64px; border-radius: 50%; background: #ffffff1f; border: 2px solid #ffffff55; box-sizing: border-box; }
      .touch-knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: #ffffff66; }
      .touch-buttons { position: absolute; right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(2, 64px); gap: 10px; direction: rtl; }
      .touch-corner { position: absolute; right: calc(12px + env(safe-area-inset-right)); top: calc(12px + env(safe-area-inset-top)); display: flex; flex-direction: row-reverse; gap: 10px; }
      .touch-button { pointer-events: auto; touch-action: none; width: 64px; height: 64px; padding: 0; border-radius: 50%; border: 2px solid #ffffff80; background: #0b102080; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 600 20px/1 system-ui, sans-serif; text-shadow: 0 1px 2px #000; direction: ltr; }
      .touch-button small { font-size: 9px; font-weight: 600; margin-top: 3px; letter-spacing: .02em; }
      .touch-corner .touch-button { width: 56px; height: 56px; font-size: 13px; }
      .touch-button:active { background: #f2a541a0; }
      body:has(#touch-controls:not([hidden])) :is(#help, #audio-panel) { display: none; }
      #fullscreen-toggle { position: fixed; right: 12px; top: 12px; z-index: 9; width: 34px; height: 34px; border: 1px solid #ffffff60; border-radius: 5px; background: #0b102099; color: #f4f1ea; font: 24px/1 system-ui, sans-serif; cursor: pointer; }
      #fullscreen-toggle[hidden] { display: none; }
      #fullscreen-toggle:hover, #fullscreen-toggle:focus-visible { background: #26344c; }
      #fullscreen-overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #06151ce6; }
      #fullscreen-overlay[hidden] { display: none; }
      #fullscreen-overlay button { padding: 18px 28px; border: 0; border-radius: 10px; background: #a1ebd3; color: #10252d; font: bold 18px system-ui, sans-serif; }
      .shop-option { touch-action: manipulation; }
    </style>
  </head>
  <body>
    <section id="loading-screen" aria-label="Loading Turku3D">
      <div class="loading-panel">
        <span class="eyebrow">TURKU3D / CITY BOOT</span><h1>Bringing Turku to life</h1>
        <p class="loading-active" role="status">Downloading game modules…</p>
        <progress aria-label="Completed loading tasks"></progress><p class="loading-count">Waiting for the engine</p>
        <pre class="loading-log" aria-label="Technical loading log"></pre>
      </div>
    </section>
    <div id="hud"></div>
    <div id="help">Connect a controller and press a button, or click for keyboard/mouse controls.</div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
