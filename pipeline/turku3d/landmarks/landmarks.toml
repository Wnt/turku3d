  [23459732.35, 6704207.02], [23459733.57, 6704207.34], [23459756.46, 6704221.62],
  [23459757.60, 6704222.42], [23459758.30, 6704223.11], [23459758.91, 6704223.94],
  [23459759.25, 6704224.80], [23459759.65, 6704227.34], [23459757.00, 6704227.77],
  [23459755.84, 6704227.75], [23459754.79, 6704227.39], [23459731.95, 6704214.20],
  [23459731.08, 6704213.61], [23459730.12, 6704212.83], [23459729.43, 6704211.96],
